services:
  - type: web
    name: raillens-train-db
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_OPEN_IN_VIEW
        value: "false"
      - key: RAILLENS_JWT_SECRET
        generateValue: true
      - key: RAILLENS_ADMIN_API_KEY
        generateValue: true
      - key: RAILLENS_CORS_ALLOWED_ORIGINS
        sync: false
      # Render's proxy appends to X-Forwarded-For (it doesn't replace it), so the leftmost entry is client-controlled.
      # Cloudflare fronts every Render service and sets True-Client-IP; Render support recommends reading it.
      - key: RAILLENS_CLIENT_IP_TRUSTED_HEADER
        value: True-Client-IP

