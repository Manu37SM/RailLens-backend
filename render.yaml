services:
  - type: web
    name: raillens-train-db
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_OPEN_IN_VIEW
        value: "false"
      - key: RAILLENS_JWT_SECRET
        generateValue: true
      - key: RAILLENS_ADMIN_API_KEY
        generateValue: true
      # Admin accounts + MFA (README "Authentication"). Set in the dashboard: `openssl rand -base64 32`, and keep a
      # copy in your password manager: if it is lost or changed, every admin must re-enrol their authenticator.
      - key: RAILLENS_MFA_ENCRYPTION_KEY
        sync: false
      - key: RAILLENS_ADMIN_BOOTSTRAP_USERNAMES
        sync: false
      - key: RAILLENS_CORS_ALLOWED_ORIGINS
        sync: false
      # Render's proxy appends to X-Forwarded-For (it doesn't replace it), so the leftmost entry is client-controlled.
      # Cloudflare fronts every Render service and sets True-Client-IP; Render support recommends reading it.
      - key: RAILLENS_CLIENT_IP_TRUSTED_HEADER
        value: True-Client-IP
      # The website's sign-in proxy (Vercel) passes the visitor's IP with this secret (Phase 2B). Same value as
      # RAILLENS_PROXY_SECRET in Vercel. `openssl rand -base64 32`.
      - key: RAILLENS_CLIENT_IP_PROXY_SECRET
        sync: false
      # Single login with RailOps (Phase 4B). Leave unset until RailOps is live; see DEPLOYMENT.md.
      - key: RAILLENS_RAILOPS_JWKS_URL
        sync: false
      - key: RAILLENS_RAILOPS_ISSUER
        sync: false
      - key: RAILLENS_RAILOPS_API_URL
        sync: false

